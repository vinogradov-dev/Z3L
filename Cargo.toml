[workspace]
resolver = "3"
members = ["crates/*", "app", "xtask", "state-contract"]
# default-members = ["crates/*", "app", "xtask", "state-contract"]
default-members = ["crates/*", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# internal
units = { path = "crates/units" }
text = { path = "crates/text" }
geom = { path = "crates/geom" }
contact-parry = { path = "crates/contact-parry" }
kernel = { path = "crates/kernel" }
model = { path = "crates/model" }
catalog = { path = "crates/catalog" }
kernel-truck = { path = "crates/kernel-truck" }
param = { path = "crates/param" }
mesh = { path = "crates/mesh" }
project = { path = "crates/project" }
export = { path = "crates/export" }
final = { path = "crates/final" }
scene = { path = "crates/scene" }
render = { path = "crates/render" }
engine = { path = "crates/engine" }
mcp = { path = "crates/mcp" }
ui = { path = "crates/ui" }
testkit = { path = "crates/testkit" }

# external
bytemuck = { version = "1.25", features = ["derive"] }
eframe = "0.37"
egui = "0.37"
egui-wgpu = "0.37"
egui_extras = { version = "0.37", features = ["svg"] }
glam = { version = "0.34", features = ["serde"] }
log = "0.4"
# Writes the interface shots U81 renders; already in the tree through `epaint`.
png = "0.18"
# Runs a future on the thread that owns it: the test harness drives wgpu's futures with it, and the
# shell parks the file manager's answer on a worker thread with it (X91). Already in the tree
# through `eframe`.
pollster = "1.0"
# The interface rules read the UI sources as Rust, not as text: `syn` gives the
# expression tree and `proc-macro2` keeps the source location of each node.
proc-macro2 = { version = "1.0", features = ["span-locations"] }
# The system file manager behind *Open* and *Save as*: MIT, pure Rust, and on each platform a binding
# to the dialog the operating system already provides — the desktop portal on Linux, the native
# sheet on macOS, the common item dialog on Windows. No GTK, so it is not a second GUI toolkit, and
# nothing C is compiled: the portal's D-Bus client is loaded at run time (ADR 0182).
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "wayland"] }
# The MCP protocol over the process's own standard streams: Apache-2.0, pure Rust, and the only
# crate allowed to depend on it and on its runtime. No editor path awaits it: the tools dispatch
# through `Session::batch`, which is synchronous (ADR 0185, ADR 0186).
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }
# The runtime the protocol runs on, in `mcp` alone. `rt` is the whole runtime a served session
# needs, and `net` with `time` are the local control channel's: one loopback listener and the
# deadline the handshake answers on (ADR 0186, ADR 0188).
tokio = { version = "1.54", default-features = false, features = ["rt", "io-std", "io-util", "sync", "net", "time"] }
# The assistant's outbound wire: one blocking OpenAI-compatible client, in `mcp` alone, with the
# operating system's TLS. `default-features = false` keeps `rustls` and its C crypto provider out of
# the tree; the exception this needs is `openssl-sys` without its `vendored` feature, and the gate
# proves it over the resolved graph (ADR 0189).
ureq = { version = "3.5", default-features = false, features = ["json", "native-tls"] }
# The bytes of the channel's run token, from the operating system's generator: MIT OR Apache-2.0,
# pure Rust (a syscall on every platform, no C source) and already in the tree through `uuid`.
getrandom = "0.3"
# The parameter schema a command publishes to a model or a CLI: a derive over the `serde` struct
# that already validates the parameters, so the description cannot drift from the parser (ADR 0185).
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
syn = { version = "2.0", features = ["full", "visit"] }
thiserror = "2.0"
truck-meshalgo = { version = "0.4", default-features = false, features = ["tessellation"] }
# The collision engine behind the contact port: Apache-2.0, pure Rust, no build
# script, glam-based, and the double build the document's micrometres need.
parry3d-f64 = "0.31"
truck-modeling = "0.6"
truck-shapeops = { version = "0.4", default-features = false }
wgpu = "30.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Upstream `truck-shapeops` enables `truck-meshalgo`'s default features, which
# pull the VTK I/O stack and its C compression backend. The vendored copy only
# narrows that dependency to `tessellation`; see vendor/truck-shapeops/PATCH.md.
[patch.crates-io]
truck-shapeops = { path = "vendor/truck-shapeops" }
