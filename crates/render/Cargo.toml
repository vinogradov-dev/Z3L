[package]
name = "render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bytemuck = { workspace = true }
geom = { workspace = true }
scene = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
# The noop backend builds a device without an adapter, so the upload cache's buffer identity is
# asserted in `cargo test` instead of only on a machine with a GPU. It ships no native code and is
# compiled only for tests.
wgpu = { workspace = true, features = ["noop"] }
# Parses and validates `scene.wgsl` in tests; already in the tree through `wgpu`.
naga = { version = "30", features = ["wgsl-in"] }
# A decor's size is a physical length, and the tests build one; the crate itself only reads it.
units = { workspace = true }
# Tests build a polyline, which carries a document id; already in the tree through `scene`.
model = { workspace = true }
# The ignored pixel test renders the product envelope offscreen and writes it next to the UI shots.
testkit = { workspace = true }
pollster = { workspace = true }
