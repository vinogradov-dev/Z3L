[package]
name = "final"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bytemuck = { workspace = true }
geom = { workspace = true }
# The one file format a final render writes, already in the tree for the interface shots: eight bits
# per channel, no interlacing, pure Rust. A codec package for every format a person might want would
# be a dependency this crate does not read (AGENTS.md §4.8).
png = { workspace = true }
# Drives the device's futures on the thread that owns them, which is how an error scope is read and a
# read-back is awaited without an async runtime in this crate. Already in the tree.
pollster = { workspace = true }
scene = { workspace = true }
thiserror = { workspace = true }
# The device the tracer borrows from the shell: the same major version `render` and `egui-wgpu` are
# pinned to, so the renderer and the tracer cannot drift into two versions of one API (AGENTS.md §5).
wgpu = { workspace = true }
# A render's lens is two physical lengths in the document's own unit — an aperture radius and a focus
# distance — so the setting is typed like the document and converted to millimetres at the tracer's
# own boundary (AGENTS.md §4.3, Y5).
units = { workspace = true }

[dev-dependencies]
# The tests build a decor whose size is a physical length; the crate itself reads one through `Length`.
units = { workspace = true }
# The tests build a frame, and a drawable carries the document id it came from; already in the tree
# through `scene`.
model = { workspace = true }
# Parses and validates `shader.wgsl` in tests; already in the tree through `wgpu`.
naga = { version = "30", features = ["wgsl-in"] }
# A directory under `target/` for the PNG a test writes, and the reader that proves it is one.
testkit = { workspace = true }
