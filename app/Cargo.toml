[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Z3L desktop application"

# The package is `app`, because it is the composition root and nothing else; the binary carries the
# product name, so `cargo run -p app` opens the editor and `target/debug/z3l` is the program
# (ADR 0135).
[[bin]]
name = "z3l"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
eframe = { workspace = true }
engine = { workspace = true }
export = { workspace = true }
geom = { workspace = true }
kernel = { workspace = true }
kernel-truck = { workspace = true }
contact-parry = { workspace = true }
mesh = { workspace = true }
model = { workspace = true }
catalog = { workspace = true }
param = { workspace = true }
project = { workspace = true }
render = { workspace = true }
scene = { workspace = true }
ui = { workspace = true }
text = { workspace = true }
units = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The system file manager: a pick runs on a worker thread so the window keeps drawing (X91).
rfd = { workspace = true }
pollster = { workspace = true }

[dev-dependencies]
# A device without a window: the interface is rendered offscreen to PNG shots (U81).
testkit = { workspace = true }
